name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# Least privilege: the test job only needs to read the repository. The ruleset
# contract checks additionally require an optional GH_TOKEN secret (see below).
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # package.json lint only checks bin/hello.js, so parse every source file
      # here without touching the zero-dependency package manifest.
      - name: Syntax check all JavaScript sources
        run: |
          set -euo pipefail
          for file in bin/*.js src/*.js test/*.js test-support/*.js; do
            node --check "$file"
          done
          echo "syntax check passed"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        env:
          # Optional: lets the four S8 ruleset probes verify live branch
          # protection. When the secret is absent they skip by design (exit 0).
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p test-results
          pnpm test 2>&1 | tee test-results/test.log

      - name: Assert zero runtime dependencies
        run: |
          count=$(node -e '
          const { readFileSync } = require("node:fs");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const runtime = { ...pkg.dependencies, ...pkg.optionalDependencies, ...pkg.peerDependencies };
          console.log(Object.keys(runtime).length);
          ')
          if [ "$count" -ne 0 ]; then
            echo "runtime dependencies: $count"
            echo "expected zero runtime dependencies but found $count" >&2
            exit 1
          fi
          echo "runtime dependencies: 0"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  deploy-staging:
    name: deploy-staging
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Require STAGING_DEPLOY_KEY
        env:
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          if [ -z "${STAGING_DEPLOY_KEY}" ]; then
            echo "::error::STAGING_DEPLOY_KEY is empty. Configure it in Settings > Environments > staging > Environment secrets."
            exit 1
          fi
          echo "STAGING_DEPLOY_KEY is configured."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Placeholder only: this repository has no real staging target yet.
      # Replace with the real deploy command before treating this as a release.
      # Deployment not verified.
      - name: Deploy to staging (placeholder, deployment not verified)
        env:
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          echo "::warning::No staging deploy target is configured; running the placeholder deploy. Deployment not verified."
          echo "Would deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA} from ${GITHUB_REF_NAME} to environment staging."

      - name: Smoke check
        run: |
          set -euo pipefail
          test "$(node bin/hello.js)" = "Hello, World!"
          test "$(node bin/hello.js --name Alice)" = "Hello, Alice!"
          echo "smoke checks passed"
