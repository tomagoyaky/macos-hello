name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Replay the suite with the spec reporter so the acceptance record can
      # compare local and CI summaries line for line.
      - name: Run tests with spec summary
        run: pnpm test -- --test-reporter=spec

      - name: Assert zero runtime dependencies
        run: |
          count=$(node -e '
          const { readFileSync } = require("node:fs");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const runtime = { ...pkg.dependencies, ...pkg.optionalDependencies, ...pkg.peerDependencies };
          console.log(Object.keys(runtime).length);
          ')
          if [ "$count" -ne 0 ]; then
            echo "runtime dependencies: $count"
            echo "expected zero runtime dependencies but found $count" >&2
            exit 1
          fi
          echo "runtime dependencies: 0"